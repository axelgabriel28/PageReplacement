<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Replacement Simulator</title>
  <style>
    body { max-width: 960px; margin: 32px auto; padding: 0 16px; font: 16px system-ui, sans-serif; color: #18243a; background: #f5f7fb; }
    main { background: white; padding: 24px; border: 1px solid #dfe5ef; border-radius: 12px; }
    h1 { margin-top: 0; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input, select, button { box-sizing: border-box; padding: 10px; font: inherit; }
    input { width: 100%; }
    select { min-width: 180px; }
    button { margin-left: 8px; color: white; background: #3b5bdb; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #8994b7; cursor: wait; }
    pre { overflow: auto; padding: 16px; background: #f4f6fa; border-radius: 8px; line-height: 1.4; }
    #status { min-height: 1.5em; }
    @media (max-width: 600px) { main { padding: 16px; } button { margin: 8px 0 0; display: block; } }
  </style>
</head>
<body>
  <main>
    <h1>Page Replacement Simulator</h1>
    <p>Run the repository's Python implementation of FIFO, LRU, and Optimal in your browser.</p>
    <label for="references">Page reference string</label>
    <input id="references" value="7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1">
    <label for="frames">Number of frames</label>
    <input id="frames" type="number" min="1" step="1" value="3">
    <label for="algorithm">Algorithm</label>
    <select id="algorithm">
      <option value="all">Compare all</option>
      <option>FIFO</option>
      <option>LRU</option>
      <option>Optimal</option>
    </select>
    <button id="run" disabled>Loading Python…</button>
    <p id="status" role="status" aria-live="polite">Loading Python…</p>
    <pre id="output" aria-label="Simulation results"></pre>
  </main>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <script>
    const runButton = document.getElementById('run');
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    let python;

    async function load() {
      try {
        python = await loadPyodide();
        const response = await fetch('./page_replacement.py');
        if (!response.ok) throw new Error(`Could not load Python file (${response.status})`);
        python.globals.set('source_code', await response.text());
        python.runPython('sim = {"__name__": "page_replacement"}\nexec(source_code, sim)');
        runButton.disabled = false;
        runButton.textContent = 'Run simulation';
        status.textContent = 'Ready.';
      } catch (error) {
        status.textContent = `Loading failed: ${error.message}`;
      }
    }

    runButton.addEventListener('click', () => {
      python.globals.set('reference_input', document.getElementById('references').value);
      python.globals.set('frame_input', document.getElementById('frames').value);
      python.globals.set('algorithm_input', document.getElementById('algorithm').value);
      try {
        output.textContent = python.runPython(`
refs = sim['parse_reference_string'](reference_input)
count = sim['validate_frames'](frame_input)
if algorithm_input == 'all':
    results = sim['run_all'](refs, count)
    text = '\\n\\n'.join(sim['render_trace'](r) for r in results)
    text += '\\n\\n' + sim['render_comparison'](results)
else:
    text = sim['render_trace'](sim['ALGORITHMS'][algorithm_input](refs, count))
text
`);
        status.textContent = 'Simulation complete.';
      } catch (error) {
        output.textContent = '';
        status.textContent = `Invalid input: ${error.message}`;
      }
    });
    load();
  </script>
</body>
</html>
